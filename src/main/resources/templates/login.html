<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">

    <!--/*/ <th:block th:insert="~{top :: top}"></th:block> /*/-->

    <body class="login-page">
        <div class="login-wrap">
            <form class="login-card" th:action="@{/login}" method="post">
                <span class="home-eyebrow">Clínica</span>
                <h1>Gestión de Turnos</h1>
                <p class="login-lead">Ingresá con tu usuario para continuar.</p>

                <div class="login-alert" th:if="${param.error}">
                    Usuario o contraseña incorrectos, o la cuenta está inactiva.
                </div>
                <div class="login-alert login-ok" th:if="${param.logout}">
                    Sesión cerrada.
                </div>

                <label for="username">Usuario</label>
                <div class="login-field">
                    <span class="login-icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="8" r="3.2"/>
                            <path d="M5.5 19.2c1.4-3 3.6-4.4 6.5-4.4s5.1 1.4 6.5 4.4"/>
                        </svg>
                    </span>
                    <input id="username" type="text" name="username" class="form-control" required="required" autofocus="autofocus" autocomplete="username"/>
                </div>

                <label for="password">Contraseña</label>
                <div class="login-field">
                    <span class="login-icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="6" y="11" width="12" height="9" rx="2"/>
                            <path d="M8.5 11V8.5a3.5 3.5 0 0 1 7 0V11"/>
                        </svg>
                    </span>
                    <input id="password" type="password" name="password" class="form-control" required="required" autocomplete="current-password"/>
                    <button type="button" class="login-eye" id="togglePassword" aria-label="Mostrar contraseña" aria-pressed="false">
                        <svg class="icon-eye" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12z"/>
                            <circle cx="12" cy="12" r="2.5"/>
                        </svg>
                        <svg class="icon-eye-off" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M3 3l18 18"/>
                            <path d="M10.6 6.2A10.8 10.8 0 0 1 12 6c6.5 0 10 6 10 6a18.5 18.5 0 0 1-4.1 4.6"/>
                            <path d="M6.1 7.5C3.8 9.2 2 12 2 12s3.5 6 10 6c1.2 0 2.3-.2 3.3-.6"/>
                            <path d="M9.9 9.9a2.5 2.5 0 0 0 3.5 3.5"/>
                        </svg>
                    </button>
                </div>

                <button type="submit" class="home-cta">Ingresar</button>
            </form>
        </div>
        <script>
            document.getElementById('togglePassword').addEventListener('click', function () {
                var input = document.getElementById('password');
                var visible = input.type === 'password';
                input.type = visible ? 'text' : 'password';
                this.classList.toggle('is-visible', visible);
                this.setAttribute('aria-pressed', visible ? 'true' : 'false');
                this.setAttribute('aria-label', visible ? 'Ocultar contraseña' : 'Mostrar contraseña');
            });
        </script>
    </body>
</html>
